name: Publish IPA releases and validate source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ipa-publishing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish IPAs staged in the Admin page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_pipeline.py publish
          if ! git diff --quiet -- catalog/content.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog/content.json
            git commit -m "Publish staged IPA releases"
            git push origin HEAD:main
          fi
      - name: Download catalogued IPA assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_pipeline.py download
      - name: Build source and admin page
        run: python3 scripts/build.py
      - name: Validate output
        run: |
          python3 -m unittest discover -s tests -v
          node tests/cloudflare-routing.mjs
          node tests/admin-auth.mjs
          node tests/ipa-upload.mjs
